name: CD

# Deploys on every push to main. The pool contract deploys first (opt-in —
# needs SANCTUM_SECRET, skips by default). The operator (Render) and frontend
# (Vercel) deploy unconditionally after, so they keep shipping on every push
# even on runs where the contract didn't redeploy.
#
# NOTE on how addresses propagate (differs from a relayer-style app):
# the operator and frontend read the deployed contract IDs from committed
# source (operator/config.js, web/src/config.js) — NOT from env vars. So when
# the contract IS redeployed, deploy-contract rewrites those files and commits
# them back to main with [skip ci]; the Render/Vercel deploys below then build
# from that updated source. This is the sanctum equivalent of aether updating
# its downstream services' env vars.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Reused across runs — the verifier already has its VK set, and the token is
  # the deterministic native XLM SAC, so only the pool is ever redeployed.
  VERIFIER_ADDRESS: CAHBSVRPU4QRWPAUERYHEVOLL376Y7V4HPMQ6XNYF527ZLQD2NTEGNUZ
  TOKEN_ADDRESS: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
  # Currently-live pool — the fallback when contract deploy is skipped.
  POOL_ADDRESS: CCDQ2BSPSUH7P2J7PK2E7Z6XLVFVTXYZVIPBUS42U22WMD2NMM7MUJCP
  OPERATOR_URL: https://sanctum-pool-uuhl.onrender.com

jobs:
  # ────────────────────── Deploy the pool contract ──────────────────────
  deploy-contract:
    name: Deploy pool (Stellar testnet)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the new address back to main
    outputs:
      pool: ${{ steps.deploy.outputs.pool }}
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ wasm32v1-none target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      # Fallback system libs in case binstall has to compile from source
      # (stellar-cli's hardware-wallet/keyring crates link dbus-1 and libudev).
      - name: Install Stellar CLI build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Pulls the prebuilt stellar binary — no native compilation needed.
      - name: Install Stellar CLI
        run: cargo binstall --no-confirm stellar-cli

      - name: Deploy and initialize the pool
        id: deploy
        env:
          SANCTUM_SECRET: ${{ secrets.SANCTUM_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SANCTUM_SECRET:-}" ]; then
            echo "::warning::SANCTUM_SECRET not set — skipping contract deploy. Add it in repo Settings → Secrets and variables → Actions to enable this job."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Import the funded admin key under the alias the app expects.
          printf '%s\n' "$SANCTUM_SECRET" | stellar keys add sanctum --secret-key --overwrite
          ADMIN="$(stellar keys address sanctum)"
          echo "admin: $ADMIN"

          # No-op if already funded (friendbot 400) — harmless.
          curl -s "https://friendbot.stellar.org/?addr=$ADMIN" > /dev/null || true

          # Build only the contract crates for wasm (not the native tool crate).
          cargo build --target wasm32v1-none --release -p sanctum-verifier -p sanctum-pool

          # Deploy the pool, reusing the existing verifier + native token.
          POOL="$(stellar contract deploy \
            --wasm target/wasm32v1-none/release/sanctum_pool.wasm \
            --source sanctum --network testnet 2>/dev/null \
            | grep -Eo 'C[A-Z0-9]{55}' | tail -1)"
          echo "pool: $POOL"

          stellar contract invoke --id "$POOL" --source sanctum --network testnet -- init \
            --verifier "$VERIFIER_ADDRESS" --token "$TOKEN_ADDRESS" --admin "$ADMIN" \
            --denom_amount 1000000 --denom_field 1000000 --scope 1

          {
            echo "pool=$POOL"
            echo "deployed=true"
          } >> "$GITHUB_OUTPUT"

      # Rewrite the committed source of truth so the operator + frontend (which
      # read contract IDs from config.js) build against what was just deployed.
      - name: Commit new pool address to main
        if: steps.deploy.outputs.deployed == 'true'
        env:
          NEW_POOL: ${{ steps.deploy.outputs.pool }}
        run: |
          set -euo pipefail
          echo "$NEW_POOL" > deployments/pool_testnet.txt
          perl -pi -e 's/(pool:\s*")C[A-Z0-9]{55}(")/${1}'"$NEW_POOL"'${2}/' \
            web/src/config.js operator/config.js

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/pool_testnet.txt web/src/config.js operator/config.js
          git commit -m "chore(deploy): pool -> $NEW_POOL [skip ci]"
          git push origin HEAD:main

  # ──────────────────────── Deploy operator (Render) ────────────────────────
  deploy-operator:
    name: Deploy operator (Render)
    runs-on: ubuntu-latest
    needs: [deploy-contract]
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::warning::RENDER_API_KEY / RENDER_SERVICE_ID not set — skipping operator redeploy. Add both in repo Settings → Secrets and variables → Actions to enable this job."
            exit 0
          fi

          # The operator reads contract IDs from committed operator/config.js
          # (already updated + pushed above when the contract redeployed), so a
          # plain redeploy of the latest main is all that's needed.
          echo "==> Triggering Render deploy (latest main)..."
          curl -sf -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'

  # ──────────────────────── Deploy frontend (Vercel) ────────────────────────
  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [deploy-contract, deploy-operator]
    steps:
      # ref: main so we upload any pool-address commit deploy-contract pushed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping Vercel deploy. Add the token as a secret and the two IDs as repo variables to enable this job."
            exit 0
          fi

          # Contract IDs come from committed web/src/config.js; the only build
          # env the frontend needs is the operator endpoint.
          npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            -b VITE_OPERATOR="$OPERATOR_URL"
